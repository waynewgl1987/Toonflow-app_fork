<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>API Debug</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:20px">
<h2>API Test</h2>
<div id="result"></div>
<script>
const d = id => document.getElementById(id);
async function test(){
  d('result').innerHTML = 'Testing...<br>';

  // Test status
  try {
    let r = await fetch('/api/services/status');
    let t = await r.text();
    d('result').innerHTML += 'GET /api/services/status -> ' + r.status + '<br><pre>' + t + '</pre><br>';
  } catch(e) { d('result').innerHTML += 'Status ERROR: ' + e.message + '<br>'; }

  // Test start-qwen3
  try {
    let r = await fetch('/api/services/start-qwen3', {method:'POST'});
    let t = await r.text();
    d('result').innerHTML += 'POST /api/services/start-qwen3 -> ' + r.status + '<br><pre>' + t + '</pre><br>';
  } catch(e) { d('result').innerHTML += 'Qwen3 ERROR: ' + e.message + '<br>'; }

  // Test start-comfyui
  try {
    let r = await fetch('/api/services/start-comfyui', {method:'POST'});
    let t = await r.text();
    d('result').innerHTML += 'POST /api/services/start-comfyui -> ' + r.status + '<br><pre>' + t + '</pre><br>';
  } catch(e) { d('result').innerHTML += 'ComfyUI ERROR: ' + e.message + '<br>'; }
}
test();
</script>
</body></html>
