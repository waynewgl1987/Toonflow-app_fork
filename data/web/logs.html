<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generation Log</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:monospace;background:#0a0a0f;color:#e0e0e0;padding:20px;font-size:12px}
h1{font-size:18px;margin-bottom:4px;color:#fff}
.sub{color:#666;font-size:11px;margin-bottom:16px}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.controls button{padding:5px 12px;background:#3b82f6;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px}
.controls button:hover{background:#2563eb}
.controls button.danger{background:#ef4444}
.controls button.danger:hover{background:#dc2626}
.controls .info{color:#888;font-size:11px}
.controls .live{color:#22c55e;font-size:11px;display:flex;align-items:center;gap:4px}
.controls .live .pulse{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.filters .tag{padding:2px 8px;border-radius:10px;font-size:10px;cursor:pointer;border:1px solid #2a2a3a;background:transparent;color:#888;transition:all .15s}
.filters .tag:hover{border-color:#555;color:#e0e0e0}
.filters .tag.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
#log{background:#0f0f13;border:1px solid #2a2a3a;border-radius:8px;padding:10px;max-height:75vh;overflow-y:auto}
.entry{display:flex;padding:2px 0;border-bottom:1px solid #111;gap:8px}
.entry .t{color:#444;min-width:85px;flex-shrink:0;font-size:11px}
.entry .e{min-width:110px;flex-shrink:0;font-size:11px}
.entry .e.err{color:#ef4444}
.entry .e.ok{color:#22c55e}
.entry .e.go{color:#3b82f6}
.entry .e.svc{color:#a78bfa}
.entry .e.warn{color:#eab308}
.entry .d{color:#777;font-size:11px;word-break:break-all;overflow:hidden}
.new-row{animation:hl 1s ease-out}
@keyframes hl{from{background:#3b82f622}to{background:transparent}}
</style>
</head>
<body>
<h1>Generation Log</h1>
<p class="sub">Real-time tracking. Auto-refreshes every 3s. <span id="sinceInfo"></span></p>
<div class="controls">
  <button onclick="toggleLive()" id="liveBtn">Pause</button>
  <button onclick="loadLog()">Refresh</button>
  
  <span class="live" id="liveIndicator"><span class="pulse"></span> LIVE</span>
  <span class="info" id="countInfo">0 entries</span>
</div>
<div class="filters" id="filters"></div>
<div id="log">Loading...</div>
<script>
let all=[], filtered=[], evtFil="", live=true, timer=null, lastCount=0, firstLoad=true;
async function loadLog(){
  try{
    const r=await fetch("/api/services/generation-log?"+Date.now());
    if(!r.ok){document.getElementById("log").textContent="No log yet. Generate something first.";return}
    const d=await r.json();
    if(!d.success){document.getElementById("log").textContent="Error: "+d.message;return}
    const entries=d.data||[];
    const isNew=entries.length!==lastCount;
    if(firstLoad)document.getElementById("sinceInfo").textContent="Entries from: "+(entries.length>0?entries[0].time:"-");
    firstLoad=false;
    if(isNew||evtFil!==document.getElementById("filters").dataset.lastFil){
      lastCount=entries.length;
      all=entries.reverse();
      applyFilter();
    }
  }catch(e){if(firstLoad){document.getElementById("log").textContent="Error: "+e.message;firstLoad=false}}
}
function applyFilter(){
  filtered=evtFil?all.filter(e=>e.event===evtFil):all;
  document.getElementById("countInfo").textContent=filtered.length+"/"+all.length+" entries";
  render();
  if(live)document.getElementById("log").querySelector(".new-row")?.scrollIntoView({behavior:"smooth",block:"end"});
}
function render(){
  const tags=new Set(all.map(e=>e.event));
  const f=document.getElementById("filters");
  f.dataset.lastFil=evtFil;
  f.innerHTML='<span class="tag'+(evtFil===""?' active':'')+'" onclick="evtFil=\'\';applyFilter()">ALL ('+all.length+')</span>';
  tags.forEach(t=>{
    const c=all.filter(e=>e.event===t).length;
    f.innerHTML+='<span class="tag'+(evtFil===t?' active':'')+'" onclick="evtFil=\''+t+'\';applyFilter()">'+t+' ('+c+')</span>';
  });
  const el=document.getElementById("log");
  el.innerHTML=filtered.map(e=>renderEntry(e,false)).join("");
}
function cls(evt){
  if(!evt)return"";
  const l=evt.toLowerCase();
  if(l.includes("error")||l.includes("fail")||l.includes("timeout"))return"err";
  if(l.includes("success")||l.includes("complete")||l.includes("listening")||l.includes("done"))return"ok";
  if(l.includes("start")&&!l.includes("success"))return"go";
  if(l.startsWith("svc_"))return"svc";
  return"";
}
function renderEntry(e,hl){
  const det=JSON.stringify(e,(k,v)=>k==="stack"?v?v.slice(0,120)+"...":v:k==="inputSnippet"?v?v.slice(0,60)+"...":v,0);
  return'<div class="entry'+(hl?' new-row':'')+'"><span class="t">'+(e.time||"").slice(11,22)+'</span><span class="e '+cls(e.event)+'">'+(e.event||"")+'</span><span class="d">'+esc(det)+'</span></div>';
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function toggleLive(){
  live=!live;
  document.getElementById("liveBtn").textContent=live?"Pause":"Live";
  document.getElementById("liveIndicator").style.display=live?"flex":"none";
  if(live){loadLog();startTimer()}
  else stopTimer();
}
function startTimer(){stopTimer();timer=setInterval(loadLog,3000)}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
async function clearLog(){
  if(!confirm("Clear log file?"))return;
  try{await fetch("/api/services/clear-log",{method:"POST"});all=[];applyFilter()}catch(e){}
}
startTimer();
</script>
</body>
</html>
