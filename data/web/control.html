<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toonflow 控制台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0f13;color:#e0e0e0;min-height:100vh;font-size:18pt}
.container{max-width:960px;margin:0 auto;padding:20px}
h1{font-size:20px;font-weight:600;margin-bottom:2px}
.subtitle{font-size:12px;color:#888;margin-bottom:16px}
/* status row */
.status-row{display:flex;gap:16px;font-size:12px;color:#888;margin-bottom:16px;flex-wrap:wrap}
.status-row span{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.green{background:#22c55e}
.dot.red{background:#ef4444}
.dot.yellow{background:#eab308}
/* service cards */
.card-row{display:flex;gap:12px;margin-bottom:16px}
.card{flex:1;background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.card-name{font-size:15px;font-weight:600}
.card-desc{font-size:11px;color:#666}
.card-status{font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.btn{padding:6px 16px;border-radius:6px;border:none;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-pri{background:#3b82f6;color:#fff}
.btn-pri:hover:not(:disabled){background:#2563eb}
.btn-dgr{background:#ef4444;color:#fff}
.btn-dgr:hover:not(:disabled){background:#dc2626}
.btn-out{background:transparent;color:#888;border:1px solid #2a2a3a}
.btn-out:hover:not(:disabled){color:#e0e0e0;border-color:#555}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
/* log panel */
.log-section{margin-top:4px}
.log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.log-header h2{font-size:14px;font-weight:600;color:#ccc}
.log-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.log-controls button{padding:3px 10px;border-radius:4px;border:none;font-size:11px;cursor:pointer}
.live-indicator{display:flex;align-items:center;gap:4px;font-size:11px;color:#22c55e}
.live-indicator .pulse{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.filter-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.filter-tag{padding:2px 8px;border-radius:10px;font-size:10px;cursor:pointer;border:1px solid #2a2a3a;background:transparent;color:#888;transition:all .1s}
.filter-tag:hover{border-color:#555;color:#e0e0e0}
.filter-tag.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.log-panel{background:#0a0a0f;border:1px solid #2a2a3a;border-radius:8px;padding:8px;height:45vh;overflow-y:auto;font-family:monospace;font-size:14pt;line-height:1.5}
.log-entry{display:flex;gap:8px;padding:2px 4px;border-bottom:1px solid #111;align-items:baseline}
.log-entry .lt{color:#444;min-width:80px;flex-shrink:0}
.log-entry .le{min-width:100px;flex-shrink:0;font-weight:500}
.log-entry .le.err{color:#ef4444}
.log-entry .le.ok{color:#22c55e}
.log-entry .le.go{color:#3b82f6}
.log-entry .le.svc{color:#a78bfa}
.log-entry .le.warn{color:#eab308}
.log-entry .ld{color:#666;word-break:break-all}
.log-entry.new-row{animation:hl .8s ease-out}
@keyframes hl{from{background:#3b82f622}to{background:transparent}}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a24;border:1px solid #2a2a3a;border-radius:8px;padding:10px 20px;font-size:13px;display:none;max-width:500px;text-align:center;z-index:100}
.toast.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.count-info{font-size:11px;color:#555}
/* responsive */
@media(max-width:640px){.card-row{flex-direction:column}.log-entry{flex-wrap:wrap;gap:2px}.log-entry .lt{min-width:70px}.log-entry .le{min-width:80px}}
</style>
</head>
<body>
<div class="container">

<h1>Toonflow 控制台</h1>
<p class="subtitle">服务管理 · 实时运行日志</p>

<!-- Status bar -->
<div class="status-row" id="statusRow">
  <span><span class="dot green"></span> App 运行中</span>
  <span id="sq"><span class="dot red"></span> Qwen3: off</span>
  <span id="sc"><span class="dot red"></span> ComfyUI: off</span>
</div>

<!-- Service cards -->
<div class="card-row" id="cards">
  <div style="text-align:center;color:#666;padding:20px;flex:1">加载中...</div>
</div>

<div class="actions" style="margin-bottom:12px">
  <button class="btn btn-out" onclick="refresh()">刷新状态</button>
  <button class="btn btn-dgr" onclick="stopAll()">停止所有</button>
</div>

<!-- Settings -->
<div style="background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:12px 16px;margin-bottom:16px">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span style="font-size:13px;font-weight:600">视频生产页固定云端+ComfyUI</span>
    <label style="position:relative;display:inline-block;width:44px;height:24px;cursor:pointer">
      <input type="checkbox" id="forceCloudToggle" onchange="toggleForceCloud()" style="opacity:0;width:0;height:0">
      <span id="toggleSlider" style="position:absolute;inset:0;background:#555;border-radius:12px;transition:.3s"></span>
      <span id="toggleKnob" style="position:absolute;left:2px;bottom:2px;width:20px;height:20px;background:white;border-radius:50%;transition:.3s"></span>
    </label>
    <span id="toggleLabel" style="font-size:12px;color:#888">关闭</span>
    <span style="font-size:11px;color:#666;margin-left:8px">开启后视频生产聊天固定使用 DeepSeek 云端 + ComfyUI</span>
  </div>
</div>

<script>
// 加载开关状态
async function loadForceCloud() {
  try {
    const r = await fetch("/api/services/force-cloud-setting");
    const d = await r.json();
    const on = d.data?.value === "1";
    document.getElementById("forceCloudToggle").checked = on;
    updateToggleUI(on);
  } catch {}
}
async function toggleForceCloud() {
  const on = document.getElementById("forceCloudToggle").checked;
  await fetch("/api/services/force-cloud-setting", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({value: on ? "1" : "0"})});
  updateToggleUI(on);
}
function updateToggleUI(on) {
  const slider = document.getElementById("toggleSlider");
  const knob = document.getElementById("toggleKnob");
  const label = document.getElementById("toggleLabel");
  slider.style.background = on ? "#22c55e" : "#555";
  knob.style.left = on ? "22px" : "2px";
  knob.style.background = on ? "#22c55e" : "white";
  label.textContent = on ? "开启" : "关闭";
}
loadForceCloud();
</script>

<!-- Log section -->
<div class="log-section">
  <div class="log-header">
    <h2>运行日志</h2>
    <div class="log-controls">
      <span class="live-indicator" id="liveIndicator"><span class="pulse"></span> 实时</span>
      <button class="btn btn-out" onclick="toggleLive()" id="liveBtn">暂停</button>
      <button class="btn btn-out" onclick="loadGenLog()">刷新</button>
      <button class="btn btn-dgr" onclick="clearLog()">清空</button>
      <span class="count-info" id="countInfo">0 条</span>
    </div>
  </div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="log-panel" id="logPanel">加载中...</div>
</div>

<div id="toast" class="toast"></div>
</div>

<script>
// ===== Service Control =====
const A = "/api/services";
function logMsg(m) {
  const p = document.getElementById("logPanel");
  const t = new Date().toLocaleTimeString();
  const d = document.createElement("div");
  d.className = "log-entry new-row";
  d.innerHTML = '<span class="lt">'+t+'</span><span class="le svc">[SYS]</span><span class="ld">'+esc(m)+'</span>';
  p.insertBefore(d, p.firstChild);
  if(p.children.length>500) p.removeChild(p.lastChild);
}
function toast(m, e) {
  const t = document.getElementById("toast");
  t.textContent = m;
  t.style.borderColor = e ? "#ef4444" : "#2a2a3a";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), e ? 5000 : 3000);
}
async function api(p, o) {
  try { const r = await fetch(A+p, {headers:{"Content-Type":"application/json"}, ...o}); const t = await r.text(); return JSON.parse(t); }
  catch(e) { return {success:false, message:e.message}; }
}
async function refresh() {
  const r = await api("/status");
  if(!r.success) { document.getElementById("cards").innerHTML = '<div style="color:#f87171;padding:20px;flex:1">'+r.message+'</div>'; return; }
  const d = r.data;
  document.getElementById("cards").innerHTML = card("qwen3", d.qwen3) + card("comfyui", d.comfyui);
  const sq = d.qwen3, sc = d.comfyui;
  document.getElementById("sq").innerHTML = '<span class="dot '+(sq.status==="running"?"green":sq.status==="starting"?"yellow":"red")+'"></span> Qwen3: '+({running:"on",starting:"启动中...",stopped:"off"})[sq.status];
  document.getElementById("sc").innerHTML = '<span class="dot '+(sc.status==="running"?"green":sc.status==="starting"?"yellow":"red")+'"></span> ComfyUI: '+({running:"on",starting:"启动中...",stopped:"off"})[sc.status];
  logMsg("服务状态 | Qwen3="+({running:"运行",starting:"启动中",stopped:"停止"})[sq.status]+" ComfyUI="+({running:"运行",starting:"启动中",stopped:"停止"})[sc.status]);
}
function card(id, s) {
  const st = s.status||(s.running?"running":"stopped");
  return '<div class="card"><div class="card-h"><div><div class="card-name">'+s.name+'</div><div class="card-desc">端口 '+s.port+'</div></div></div>'+
    '<div class="card-status"><span class="dot '+(st==="running"?"green":st==="starting"?"yellow":"red")+'"></span> '+({running:"运行中",starting:"启动中...",stopped:"已停止"})[st]+'</div>'+
    '<div>'+(st==="running"?'<button class="btn btn-dgr" onclick="stopSvc(\''+id+'\')">停止</button>':'<button class="btn btn-pri" onclick="startSvc(\''+id+'\')">启动</button>')+'</div></div>';
}
async function startSvc(id) {
  logMsg("正在启动 "+id+"...");
  toast("正在启动...");
  const r = await api("/"+(id==="qwen3"?"start-qwen3":"start-comfyui"), {method:"POST"});
  if(r.success) {
    toast("启动命令已发送（"+r.message.replace(/https?:\/\/[^ ]+/g,'').trim()+"）", false);
    logMsg("启动命令已发送，后台监测中...");
    // 立即刷新状态（显示"启动中"黄点）
    refresh();
    // 快速轮询：每 3 秒刷新一次，持续监测启动进度
    if(window._startPollTimer) clearInterval(window._startPollTimer);
    window._startPollTimer = setInterval(refresh, 3000);
    // 记录启动开始时间，给用户预计时间参考
    window._startTime = Date.now();
    // 5 分钟后停止快速轮询
    setTimeout(() => { if(window._startPollTimer) { clearInterval(window._startPollTimer); window._startPollTimer = null; } }, 300000);
  } else {
    toast(r.message||"启动失败", true);
    logMsg("启动失败: "+r.message);
    setTimeout(refresh, 2000);
  }
}

// 在 refresh 基础上增强：添加时间提示和超时提醒
const origRefresh = refresh;
refresh = function() {
  origRefresh();
  
  // 检查 comfyui 是否启动太久
  const sc = document.getElementById("sc");
  if (!sc) return;
  const isStarting = sc.textContent.includes("启动中");
  if (isStarting && window._startTime) {
    const elapsed = Math.round((Date.now() - window._startTime) / 1000);
    // 给状态栏加耗时显示（避免修改服务器返回的纯文本）
    if (elapsed > 10 && elapsed % 15 === 0) {
      logMsg("ComfyUI 启动中... 已等待 "+elapsed+" 秒（首次启动约需 30-90 秒）");
    }
    if (elapsed > 120) {
      logMsg("⚠️ ComfyUI 启动超过 2 分钟，请检查日志面板是否有错误信息");
    }
  }
};
async function stopSvc(id) {
  logMsg("正在停止...");
  toast("正在停止...");
  const r = await api("/stop-all", {method:"POST"});
  toast(r.message||"已停止", !r.success);
  logMsg("停止: "+(r.message||"done"));
  window._startTime = null;
  if(window._startPollTimer) { clearInterval(window._startPollTimer); window._startPollTimer = null; }
  setTimeout(refresh, 1500);
}
async function stopAll() {
  logMsg("停止所有服务...");
  toast("正在停止所有...");
  const r = await api("/stop-all", {method:"POST"});
  toast(r.message||"完成", !r.success);
  setTimeout(refresh, 1500);
}

// ===== Generation Log Viewer =====
let allEntries = [], filteredEntries = [], eventFilter = "", liveMode = true, pollTimer = null, lastCount = 0;

async function loadGenLog() {
  try {
    const r = await fetch("/api/services/generation-log?"+Date.now());
    if(!r.ok) { document.getElementById("logPanel").textContent = "暂无日志，请先生成内容。"; return; }
    const d = await r.json();
    if(!d.success) return;
    const entries = d.data || [];
    if(entries.length !== lastCount) {
      lastCount = entries.length;
      allEntries = entries.reverse();
      applyFilter();
    }
  } catch(e) { /* silent */ }
}
function applyFilter() {
  filteredEntries = eventFilter ? allEntries.filter(e => e.event === eventFilter) : allEntries;
  document.getElementById("countInfo").textContent = filteredEntries.length+"/"+allEntries.length+" 条";
  renderLog();
}
function renderLog() {
  const el = document.getElementById("logPanel");
  const tags = new Set(allEntries.map(e => e.event));
  const fb = document.getElementById("filterBar");
  fb.innerHTML = '<span class="filter-tag'+(eventFilter===""?' active':'')+'" onclick="eventFilter=\'\';applyFilter()">全部 ('+allEntries.length+')</span>';
  tags.forEach(t => {
    const c = allEntries.filter(e => e.event === t).length;
    fb.innerHTML += '<span class="filter-tag'+(eventFilter===t?' active':'')+'" onclick="eventFilter=\''+t+'\';applyFilter()">'+t+' ('+c+')</span>';
  });
  el.innerHTML = filteredEntries.map(e => renderEntry(e)).join("");
  if(liveMode && el.children.length) el.lastChild.scrollIntoView({behavior:"smooth", block:"end"});
}
function eventClass(evt) {
  if(!evt) return "";
  const l = evt.toLowerCase();
  if(l.includes("error")||l.includes("fail")||l.includes("timeout")||l.includes("zombie")) return "err";
  if(l.includes("success")||l.includes("complete")||l.includes("listening")||l.includes("ready")||l.includes("done")) return "ok";
  if(l.includes("start")&&!l.includes("success")) return "go";
  if(l.startsWith("svc_")) return "svc";
  return "";
}
function renderEntry(e) {
  const detail = JSON.stringify(e, (k,v) => {
    if(k==="stack") return v ? v.slice(0,160)+"..." : v;
    if(k==="inputSnippet") return v ? v.slice(0,80)+"..." : v;
    return v;
  }, 0);
  return '<div class="log-entry"><span class="lt">'+(e.time||"").slice(11,22)+'</span><span class="le '+eventClass(e.event)+'">'+(e.event||"")+'</span><span class="ld">'+esc(detail)+'</span></div>';
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toggleLive() {
  liveMode = !liveMode;
  document.getElementById("liveBtn").textContent = liveMode ? "暂停" : "实时";
  document.getElementById("liveIndicator").style.display = liveMode ? "flex" : "none";
  if(liveMode) { loadGenLog(); startPoll(); } else stopPoll();
}
function startPoll() { stopPoll(); pollTimer = setInterval(loadGenLog, 3000); }
function stopPoll() { if(pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
async function clearLog() {
  if(!confirm("确定清空日志文件？")) return;
  try { await fetch("/api/services/clear-log", {method:"POST"}); allEntries = []; applyFilter(); logMsg("日志已清空"); } catch(e) {}
}

// ===== Init =====
refresh();
loadGenLog();
startPoll();
</script>
</body>
</html>
